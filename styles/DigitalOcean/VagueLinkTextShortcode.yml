extends: existence
message: "Vague link text: '%s'. Use link text that describes the destination."
link: https://docs.digitalocean.com/style/digitalocean/language/links-and-link-text
level: error
# Companion to DigitalOcean.VagueLinkText, which uses `scope: link` and so only
# sees links Vale's Markdown parser recognizes. It does not recognize a Hugo
# shortcode as a link destination: `[here](https://example.com)` and
# `[here](/products/droplets/)` are parsed as links, but
# `[here]({{< relref "/products/droplets" >}})` and `[here]({{< ref "x" >}})`
# are not. Verified independently of any consumer's TokenIgnores.
#
# That matters because internal links in Hugo sites are usually required to use
# relref. On product-docs, 8 of the 11 real violations use a shortcode target,
# so the scoped rule alone found 3 of 11.
#
# This rule covers only that gap, so it is deliberately narrow: `raw` scope but
# the destination must open with `{{`. `raw` is not syntax-aware and reports
# inside code, which is why the general case belongs in the scoped rule. The
# residual false-positive surface here is a shortcode-target link with vague
# link text sitting inside a code block, which does not occur in product-docs:
# of 5,809 shortcode-target links, 8 have vague link text and all 8 are prose,
# with none in fenced, indented, or inline code.
#
# (?<!!) keeps image alt text out, since `![here](...)` is not link text.
#
# Remove this rule if Vale learns to parse shortcode link destinations.
scope: raw
nonword: true
ignorecase: true
tokens:
  - '(?<!!)\[[*_ ]*(?:click this link|follow this link|more information|click here|learn more|more details|read more|this page|this link|more info|here)[*_ ]*[.,!?:;]?[*_ ]*\]\(\s*\{\{'
