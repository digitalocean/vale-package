extends: existence
message: "Vague link text: '%s'. Use link text that describes the destination."
link: https://docs.digitalocean.com/style/digitalocean/language/links-and-link-text
level: error
# `scope: link` restricts the rule to link text, which is the only way to tell
# it apart from ordinary prose. Without a scope this was a bare word search: it
# flagged "For more information, see [Deploy from Container Images](...)", where
# the link text already describes the destination and the vague phrase is just
# part of the sentence. On product-docs that was 828 errors, of which only 111
# matches were inside link text at all and only 12 described nothing.
#
# The scope is syntax-aware, so images, inline code, fenced code, and indented
# code are all excluded. Approximating it with `scope: raw` and a bracket
# pattern does not get that: raw sees the whole source, so a `[here](url)`
# example inside a fenced code block is reported.
#
# REQUIRES VALE >= 3.17.0. `link` was removed and later reinstated; 3.16.0 and
# earlier fail with "E201: scope 'link' is no longer supported", which aborts
# the run rather than skipping the rule.
#
# Tokens are anchored because the phrase has to be the whole link text, not
# merely present in it. Unanchored, this still fires on "Learn more about taxes
# in Canada" and "Learn more about Droplet availability", which are exactly the
# link text we want; that variant reported 88 on product-docs, mostly wrong, and
# is what f2ad6c4 tried and f583e05 reverted.
#
# The optional [*_ ] padding covers bold and italic link text ("**here**") and
# the punctuation class covers a trailing period ("Learn more.").
scope: link
nonword: true
ignorecase: true
tokens:
  - '^[*_ ]*(?:click this link|follow this link|more information|click here|learn more|more details|read more|this page|this link|more info|here)[*_ ]*[.,!?:;]?[*_ ]*$'
