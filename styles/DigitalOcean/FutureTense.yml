extends: existence
message: "Use present tense verbs, not future tense verbs like '%s'. Say '(event) happens' instead of '(event) will happen'."
link: https://docs.digitalocean.com/style/digitalocean/language/verbs
ignorecase: true
level: error
# No action. Fixing this needs the verb reconjugated, not the auxiliary deleted:
# "you will be prompted" becomes "you are prompted", not "you be prompted".
# `remove` produced that broken output, and none of Vale's other actions
# (replace, edit, convert) can conjugate, so the rule reports and leaves the
# rewrite to a human.
tokens:
- will
- shall
- won't
- shan't
- "[A-Za-z]*'ll"
